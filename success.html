<!DOCTYPE html><html lang="en" id="html-root"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order confirmed — MekoShop</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"></head>
<body><header class="header"><div class="header-main"><a class="logo" href="index.html">meko<small>shop</small></a></div></header>
<div style="max-width:640px;margin:30px auto;background:#fff;border-radius:18px;padding:26px;text-align:center"><div class="big-check" style="width:70px;height:70px;background:#0a9b6c;color:#fff;font-size:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">✓</div><h2>Thank you! Order confirmed 🎉</h2><div id="s-info" style="margin:12px 0"></div><div id="s-pay"></div><div class="tl" style="display:flex;margin:14px 0"><div style="flex:1;background:linear-gradient(135deg,#6c2bff,#ff2e7e);color:#fff;padding:8px;border-radius:8px 0 0 8px">Pending</div><div style="flex:1;background:#f1f1f1;padding:8px">Paid</div><div style="flex:1;background:#f1f1f1;padding:8px">Shipped</div><div style="flex:1;background:#f1f1f1;padding:8px;border-radius:0 8px 8px 0">Delivered</div></div><a class="btn-primary" style="display:block;text-decoration:none;text-align:center" href="account.html">Track in My Account →</a><br><a href="index.html">Continue shopping</a></div>
<script src="config.js"></script><script>const id=new URLSearchParams(location.search).get("id");let o=null;try{o=(JSON.parse(localStorage.getItem("meko_orders")||"[]")).find(x=>x.id===id)}catch(e){}document.getElementById("s-info").innerHTML=o?`<b>${o.id}</b> • ${o.total!=null?(window.MEKO_CONFIG||{}).CURRENCY||"$":""}${(o.total||0).toFixed(2)} • ${o.city}`:"";const c=(window.MEKO_CONFIG||{});let h="";if(c.STRIPE_PAYMENT_LINK)h+=`<a class="btn-primary" style="display:block;text-decoration:none;text-align:center;margin:6px 0" href="${c.STRIPE_PAYMENT_LINK}" target="_blank">Pay with Stripe</a>`;if(c.PAYPAL_ME)h+=`<a class="btn-primary" style="display:block;text-decoration:none;text-align:center" href="${c.PAYPAL_ME}" target="_blank">Pay with PayPal</a>`;if(h)document.getElementById("s-pay").innerHTML="<p>Complete payment:</p>"+h;else document.getElementById("s-pay").innerHTML="<p style='color:#666;font-size:13px'>Pay on delivery / card confirmed. Receipt emailed.</p>";</script>
</body></html>
