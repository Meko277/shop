<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - MekoShop</title><link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>.admin{max-width:1200px;margin:20px auto;padding:0 14px}.login-card{max-width:380px;margin:80px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);text-align:center}.login-card input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tabs button{border:0;padding:11px 20px;border-radius:20px;cursor:pointer;background:#fff;font-weight:600}.tabs button.on{background:#131921;color:#fff}.panel{background:#fff;border-radius:12px;padding:18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:linear-gradient(135deg,#131921,#232f3e);color:#fff;border-radius:12px;padding:18px;text-align:center}.stat b{font-size:26px;display:block;color:#ffd814}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#f5f5f5}table img{width:50px;height:50px;object-fit:cover;border-radius:8px}.btn{border:0;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px}.btn-e{background:#e7f3ff}.btn-d{background:#fde8e8}.btn-s{background:#067d62;color:#fff;padding:11px 22px;font-size:14px;font-weight:700;border-radius:8px}.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.frow input,.frow select,.frow textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:5px 0}.frow .full{grid-column:1/-1}#preview{max-width:120px;border-radius:8px;margin-top:6px}</style>
</head>
<body>
<header class="header"><div class="header-main"><a class="logo" href="index.html">Meko<span>Shop</span><small> admin</small></a><div style="flex:1"></div><a class="h-link" href="index.html"><i class="fa fa-store"></i><span>View Store</span></a><button class="h-link" id="logout" style="display:none"><i class="fa fa-sign-out"></i><span>Logout</span></button></div></header>
<div id="login-view"><div class="login-card"><h2>🔐 Admin Login</h2><p style="color:#666;font-size:13px">Default: admin / admin123</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn-primary" id="login-btn">Login</button></div></div>
<div id="admin-view" class="admin" style="display:none">
<div class="stats"><div class="stat"><b id="s-rev">$0</b><span>Revenue</span></div><div class="stat"><b id="s-ord">0</b><span>Orders</span></div><div class="stat"><b id="s-pro">0</b><span>Products</span></div><div class="stat"><b id="s-stock">0</b><span>Units in stock</span></div></div>
<div class="tabs"><button class="on" data-t="products">📦 Products</button><button data-t="add">➕ Add Product</button><button data-t="orders">🧾 Orders</button></div>
<div class="panel" id="tab-products"><table><thead><tr><th>Img</th><th>Name</th><th>Cat</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="p-rows"></tbody></table></div>
<div class="panel" id="tab-add" style="display:none"><h3 id="form-title">Add Product</h3><div class="frow"><input id="f-name" class="full" placeholder="Product name"><input id="f-cat" placeholder="Category (Electronics, Fashion...)"><input id="f-price" type="number" placeholder="Price"><input id="f-old" type="number" placeholder="Old price (optional)"><input id="f-stock" type="number" placeholder="Stock"><input id="f-rating" type="number" step="0.1" min="1" max="5" placeholder="Rating 1-5"><input id="f-img" class="full" placeholder="Image URL (or upload below)"><input type="file" id="f-file" accept="image/*" class="full"><img id="preview" style="display:none"><textarea id="f-desc" class="full" placeholder="Description"></textarea></div><button class="btn-s" id="save-p">💾 Save Product</button> <button class="btn" id="cancel-e">Cancel</button></div>
<div class="panel" id="tab-orders" style="display:none"><div id="o-list"></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body></html>
