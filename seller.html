<!DOCTYPE html>
<html lang="en" id="html-root">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller Dashboard — MekoShop</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>.wrap{max-width:1200px;margin:18px auto;padding:0 14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card2{background:#fff;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(20,20,60,.08)}.card2 b{font-size:24px;display:block}.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tabs button{border:0;padding:10px 18px;border-radius:20px;background:#fff;font-weight:700;cursor:pointer}.tabs button.on{background:#14142b;color:#fff}.panel{background:#fff;border-radius:16px;padding:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}img.t{width:46px;height:46px;object-fit:cover;border-radius:8px}.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.frow input,.frow textarea,.frow select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px 0}.full{grid-column:1/-1}.btn{border:0;padding:8px 14px;border-radius:8px;cursor:pointer}.be{background:#e7f3ff}.bd{background:#fde8e8}.bs{background:#6c2bff;color:#fff;padding:11px 22px;font-weight:800;border-radius:10px}</style>
</head>
<body>
<header class="header"><div class="header-main"><a class="logo" href="index.html">meko<small>shop</small></a><div style="flex:1"></div><a class="hbtn" href="index.html">Store</a><a class="hbtn" href="admin.html" id="adm-link" style="display:none">Admin</a><button class="hbtn" id="logout">Logout</button></div></header>
<div class="wrap" id="apply-view" style="display:none"><div class="panel"><h2>🏪 Become a seller</h2><p style="color:#666;font-size:14px">Apply once — admin approves. Then manage your own products & orders.</p><div class="frow"><input id="s-store" class="full" placeholder="Store name"><input id="s-phone" placeholder="Phone"><input id="s-city" placeholder="City"><input id="s-nid" placeholder="National ID / Commercial reg."><textarea id="s-addr" class="full" placeholder="Business address"></textarea></div><button class="bs" id="apply-btn">Submit application</button></div></div>
<div class="wrap" id="dash-view" style="display:none">
<h2 id="store-title">Seller Dashboard</h2><p id="seller-status" style="color:#666"></p>
<div class="cards"><div class="card2"><b id="m-rev">$0</b><span>Revenue (after commission)</span></div><div class="card2"><b id="m-ord">0</b><span>Orders</span></div><div class="card2"><b id="m-pro">0</b><span>My products</span></div><div class="card2"><b id="m-low">0</b><span>Low stock (≤5)</span></div></div>
<div class="tabs"><button class="on" data-t="orders">Orders</button><button data-t="products">My Products</button><button data-t="add">Add Product</button><button data-t="returns">Returns</button><button data-t="settings">Store settings</button></div>
<div class="panel" id="t-orders"><div id="so-list"></div></div>
<div class="panel" id="t-products" style="display:none"><table><thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="sp-rows"></tbody></table></div>
<div class="panel" id="t-add" style="display:none"><h3 id="f-title">Add product</h3><div class="frow"><input id="p-name" class="full" placeholder="Name"><input id="p-cat" placeholder="Category"><input id="p-brand" placeholder="Brand"><input id="p-price" type="number" placeholder="Price"><input id="p-old" type="number" placeholder="Old price"><input id="p-stock" type="number" placeholder="Stock"><input id="p-sku" placeholder="SKU"><input id="p-img" class="full" placeholder="Image URL"><input type="file" id="p-file" accept="image/*" class="full"><img id="p-prev" style="max-width:120px;border-radius:8px;display:none"><textarea id="p-desc" class="full" placeholder="Description"></textarea><input id="p-specs" class="full" placeholder='Specs JSON e.g. {"RAM":"8GB"}'></div><button class="bs" id="p-save">Save</button> <button class="btn" id="p-cancel">Cancel</button></div>
<div class="panel" id="t-returns" style="display:none"><div id="sr-list"></div></div>
<div class="panel" id="t-settings" style="display:none"><div class="frow"><input id="st-store" placeholder="Store name"><input id="st-phone" placeholder="Phone"><input id="st-city" placeholder="City"><textarea id="st-addr" class="full" placeholder="Address"></textarea></div><button class="bs" id="st-save">Save store</button></div>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script><script src="firebase.js"></script><script src="mailer.js"></script><script src="billing.js"></script><script src="roles.js"></script><script src="db.js"></script><script src="market.js"></script><script src="seller.js"></script>
</body></html>
