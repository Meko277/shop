<!DOCTYPE html>
<html lang="en" id="html-root">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product — MekoShop</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>.pwrap{max-width:1200px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.gal{background:#fff;border-radius:18px;padding:14px}.gal img.main{width:100%;height:380px;object-fit:cover;border-radius:12px}.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.thumbs img.on{border-color:#6c2bff}.info{background:#fff;border-radius:18px;padding:18px}.rev{background:#fff;border-radius:14px;padding:12px;margin:8px 0}.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.rel .card{font-size:12px}@media(max-width:860px){.pwrap{grid-template-columns:1fr}}</style>
</head>
<body>
<header class="header"><div class="header-main"><a class="logo" href="index.html">meko<small>shop</small></a><div class="searchbar"><input id="search-input" placeholder="Search..."><button onclick="location.href='index.html?q='+encodeURIComponent(document.getElementById('search-input').value)"><i class="fa fa-search"></i></button></div><div class="h-actions"><a class="hbtn" href="index.html">Store</a><button class="hbtn primary" id="cart-btn">Bag <b id="cart-count">0</b></button><span id="auth-area"></span></div></div></header>
<div class="pwrap"><div class="gal"><img class="main" id="g-main"><div class="thumbs" id="g-thumbs"></div></div>
<div class="info"><div id="p-info"></div><div class="qty" style="display:flex;gap:10px;align-items:center;margin:12px 0"><button id="q-m">-</button><b id="q-n">1</b><button id="q-p">+</button></div><button class="btn-primary" id="p-add">Add to Bag</button><button class="btn-ghost" id="p-buy">Buy Now</button> <button class="hbtn" id="p-wish">♥ Wishlist</button><div id="p-meta" style="margin-top:10px;font-size:13px;color:#555"></div><button class="hbtn" id="p-share">Share</button></div></div>
<div class="pwrap" style="grid-template-columns:1fr"><div class="gal"><h3>Specifications</h3><div id="p-specs"></div><h3 style="margin-top:14px">Reviews</h3><div id="rev-list"></div><div style="display:flex;gap:8px;margin-top:8px"><select id="r-star"><option value="5">5★</option><option value="4">4★</option><option value="3">3★</option><option value="2">2★</option><option value="1">1★</option></select><input id="r-text" placeholder="Write a review..." style="flex:1;padding:10px;border:1px solid #ccc;border-radius:8px"><button class="hbtn primary" id="r-send">Post</button></div><h3 style="margin-top:14px">Related</h3><div class="rel" id="p-rel"></div></div></div>
<div class="drawer" id="cart-drawer"><div class="d-head"><h3>Bag (<span id="d-count">0</span>)</h3><button data-close>×</button></div><div class="d-items" id="cart-items"></div><div class="d-foot"><b id="cart-total"></b><button class="btn-primary" onclick="location.href='checkout.html'">Checkout →</button></div></div>
<div id="overlay" class="overlay"></div><div class="toast" id="toast"></div>
<script src="config.js"></script><script src="firebase.js"></script><script src="mailer.js"></script><script src="billing.js"></script><script src="roles.js"></script><script src="db.js"></script><script src="market.js"></script><script src="store.js"></script><script src="auth.js"></script><script src="product.js"></script>
</body></html>
